<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilingue — Dictionnaire & traducteur</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1b16;--mute:#6f675c;--line:#e6dfd3;--acc:#b5482a;--acc2:#fbe9e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#211d17;--ink:#f1ebe0;--mute:#a39a8b;--line:#38322a;--acc:#ec8a6b;--acc2:#3a2219;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#211d17;--ink:#f1ebe0;--mute:#a39a8b;--line:#38322a;--acc:#ec8a6b;--acc2:#3a2219;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Iowan Old Style",serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.split{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
@media(min-width:820px){.split{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.pane-in{position:sticky;top:16px}}
.ph{font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 6px}
.empty{color:var(--mute);font:15px system-ui,sans-serif;padding:24px 4px;text-align:center}
.sense{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.sense:hover{background:var(--acc2)}
.sense input{margin-top:7px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.sense.on{background:var(--acc2)}
.ctx{font:600 12px system-ui,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.sense .main{font-size:21px;margin:0}
.sel{position:sticky;bottom:8px;border-color:var(--acc)}
.sel li{font-size:15px}.sel ul{margin:6px 0;padding-left:18px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 18px;font:14px system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:system-ui,sans-serif}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:99px;font:14px system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
textarea{width:100%;min-height:160px;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);font:20px/1.4 Georgia,serif;margin-top:10px}
.go{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 15px system-ui,sans-serif;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.ghost{background:none;border:0;color:var(--mute);font:13px system-ui,sans-serif;cursor:pointer;text-decoration:underline}
.sp{flex:1}
#out{display:grid;gap:12px}
.res h2{margin:0;font-size:13px;font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.main{font-size:26px;margin:4px 0 2px;line-height:1.25}
.pos{font:italic 14px Georgia,serif;color:var(--mute)}
.alts{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}
.alts span{background:var(--acc2);border-radius:8px;padding:2px 9px;font:14px system-ui,sans-serif}
.note{font:14px system-ui,sans-serif;color:var(--mute);margin:6px 0}
.ex{border-left:3px solid var(--line);padding-left:10px;margin:8px 0;font-size:15px}
.ex i{display:block;color:var(--mute);font-size:14px}
.def{font-size:15px;margin:0 0 4px}
.err{color:#b3261e;font:14px system-ui,sans-serif}
.hist{margin-top:18px}
.hist button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;color:var(--ink);font:15px Georgia,serif;cursor:pointer}
.hist small{color:var(--mute);font-family:system-ui,sans-serif}
.tag{display:inline-block;font:12px system-ui,sans-serif;background:var(--acc2);color:var(--acc);padding:2px 8px;border-radius:99px;margin-bottom:6px}
</style>
</head>
<body>
<main>
<h1>Trilingue <span>·</span> FR EN ES</h1>
<p class="sub">Dictionnaire et traducteur : mots, phrases et expressions idiomatiques, propulsés par Claude.</p>

<div class="split">
<section class="card pane-in" aria-label="Texte à traduire">
  <p class="ph">1 · Texte à traduire</p>
  <div class="row"><span class="lbl">De</span><span id="src"></span></div>
  <div class="row" style="margin-top:8px"><span class="lbl">Vers</span><span id="tgt"></span></div>
  <textarea id="q" placeholder="Tapez un mot, une phrase ou une expression…" aria-label="Texte à traduire"></textarea>
  <div class="row"><button class="go" id="go">Traduire</button><span class="sp"></span><button class="ghost" id="clr">Effacer</button></div>
  <div class="hist" id="hist"></div>
</section>
<section aria-label="Traduction">
  <p class="ph">2 · Traduction</p>
  <div id="out" aria-live="polite"><div class="card empty">La traduction apparaîtra ici.<br>Pour un mot seul, tous ses sens s’affichent : cochez ceux qui vous conviennent.</div></div>
</section>
</div>
</main>

<script>
const LN={fr:"Français",en:"English",es:"Español"};
let src="auto",tgt="all",sample=null,busy=false;
const $=id=>document.getElementById(id);

function chips(el,opts,cur,set){
  el.innerHTML="";
  opts.forEach(([v,t])=>{const b=document.createElement("button");b.className="chip";b.textContent=t;
    b.setAttribute("aria-pressed",String(v===cur));b.onclick=()=>{set(v);draw()};el.appendChild(b)});
}
function draw(){
  chips($("src"),[["auto","Détecter"],["fr","FR"],["en","EN"],["es","ES"]],src,v=>src=v);
  chips($("tgt"),[["all","Les deux autres"],["fr","FR"],["en","EN"],["es","ES"]],tgt,v=>tgt=v);
}
draw();

(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!sample)$("out").innerHTML='<div class="card err">La traduction nécessite d’ouvrir cette page depuis claude.ai.</div>';})();

const store={get(){try{return JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){return[]}},
  set(v){try{localStorage.setItem("hist",JSON.stringify(v.slice(0,15)))}catch(e){}}};
function renderHist(){
  const h=store.get(),el=$("hist");el.innerHTML="";
  if(!h.length)return;
  const t=document.createElement("div");t.className="lbl";t.textContent="Recherches récentes";el.appendChild(t);
  h.forEach(x=>{const b=document.createElement("button");b.textContent=x.q.slice(0,70)+" ";
    const s=document.createElement("small");s.textContent=x.d.toUpperCase();b.appendChild(s);
    b.onclick=()=>{$("q").value=x.q;show(x.r)};el.appendChild(b)});
}
renderHist();

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

let picked=new Map();
function show(r){
  const out=$("out");out.innerHTML="";picked=new Map();
  const kinds={word:"Mot",phrase:"Phrase",idiom:"Expression idiomatique"};
  const head=el("div","card");
  head.appendChild(el("span","tag",(kinds[r.kind]||"Texte")+" · "+(LN[r.detected]||"?")));
  if(r.definition)head.appendChild(el("p","def",r.definition));
  if(r.kind==="idiom"&&r.literal)head.appendChild(el("div","note","Sens littéral : "+r.literal));
  out.appendChild(head);
  const selBox=el("div","card sel");selBox.hidden=true;
  const upd=()=>{
    selBox.innerHTML="";selBox.hidden=!picked.size;if(!picked.size)return;
    selBox.appendChild(el("p","ph","Ma sélection ("+picked.size+")"));
    const ul=el("ul");picked.forEach(t=>ul.appendChild(el("li",null,t)));selBox.appendChild(ul);
    const cp=el("button","go","Copier la sélection");
    cp.onclick=()=>{try{navigator.clipboard.writeText([...picked.values()].join("\n"));cp.textContent="Copié ✓"}catch(e){}};
    selBox.appendChild(cp);
  };
  (r.results||[]).forEach(x=>{
    const c=el("div","card res");
    c.appendChild(el("h2",null,LN[x.lang]||x.lang));
    if(r.kind==="word"&&x.senses&&x.senses.length){
      x.senses.forEach((n,i)=>{
        const key=x.lang+i,lab=el("label","sense"),cb=el("input");cb.type="checkbox";
        const body=el("div");
        body.appendChild(el("div","ctx",n.context||"Général"));
        body.appendChild(el("div","main",n.translation));
        if(n.pos)body.appendChild(el("div","pos",n.pos));
        if(n.example&&n.example.text){const d=el("div","ex",n.example.text);d.appendChild(el("i",null,n.example.tr||""));body.appendChild(d)}
        cb.onchange=()=>{lab.classList.toggle("on",cb.checked);
          cb.checked?picked.set(key,n.translation+" ("+(n.context||"Général")+") — "+LN[x.lang]):picked.delete(key);upd()};
        lab.append(cb,body);c.appendChild(lab);
      });
    }else{
      c.appendChild(el("div","main",x.main));
      if(x.pos)c.appendChild(el("div","pos",x.pos));
      if(x.alternatives&&x.alternatives.length){const a=el("div","alts");x.alternatives.forEach(s=>a.appendChild(el("span",null,s)));c.appendChild(a)}
      if(x.note)c.appendChild(el("div","note",x.note));
      (x.examples||[]).forEach(e=>{const d=el("div","ex",e.text);d.appendChild(el("i",null,e.tr));c.appendChild(d)});
      const cp=el("button","ghost","Copier");cp.onclick=()=>{try{navigator.clipboard.writeText(x.main);cp.textContent="Copié ✓"}catch(e){}};
      c.appendChild(cp);
    }
    out.appendChild(c);
  });
  out.appendChild(selBox);
}

async function run(){
  const q=$("q").value.trim();
  if(!q||busy||!sample)return;
  busy=true;$("go").disabled=true;$("go").textContent="Traduction…";
  const targets=tgt==="all"?"les deux autres langues parmi fr, en, es (autres que la langue source)":"uniquement "+tgt;
  const prompt=`Tu es un dictionnaire et traducteur expert trilingue français/anglais/espagnol.
Texte : """${q}"""
Langue source : ${src==="auto"?"à détecter":src}. Cibles : ${targets}.
Réponds UNIQUEMENT par un JSON valide, sans balise markdown.
Si le texte est un MOT seul (kind "word") : pour chaque langue cible, liste TOUS les sens et contextes d’emploi (jusqu’à 10, du plus courant au plus rare : sens courant, familier, technique, figuré, expressions courantes, etc.) :
{"detected":"fr|en|es","kind":"word","definition":"définition courte en français","results":[{"lang":"fr|en|es","senses":[{"context":"label court du contexte, ex : cuisine, familier, informatique, figuré","translation":"traduction dans ce contexte","pos":"classe grammaticale et genre","example":{"text":"exemple dans la langue cible","tr":"traduction en français"}}]}]}
Si c’est une phrase (kind "phrase") ou une expression idiomatique (kind "idiom") :
{"detected":"fr|en|es","kind":"phrase|idiom","definition":"définition si idiom, sinon vide","literal":"sens littéral si idiom, sinon vide","results":[{"lang":"fr|en|es","main":"traduction la plus naturelle","pos":"","alternatives":["max 4"],"note":"nuance de registre ou faux ami, en français","examples":[{"text":"exemple dans la langue cible","tr":"traduction en français"}]}]}
Pour une expression idiomatique, donne l’équivalent idiomatique et non une traduction mot à mot. Pas d’exemples pour une longue phrase.`;
  try{
    const r=await sample.json(prompt);
    show(r);
    const h=store.get().filter(x=>x.q!==q);h.unshift({q,d:r.detected||"?",r});store.set(h);renderHist();
  }catch(e){
    const code=e&&e.code;
    $("out").innerHTML="";
    $("out").appendChild(el("div","card err",code==="not_granted"?"Autorisation refusée : acceptez l’accès à Claude pour traduire.":code==="rate_limited"?"Trop de requêtes, réessayez dans un instant.":"Impossible de traduire pour le moment. Réessayez."));
  }
  busy=false;$("go").disabled=false;$("go").textContent="Traduire";
}
$("go").onclick=run;
$("clr").onclick=()=>{$("q").value="";$("out").innerHTML="";$("q").focus()};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey||!e.shiftKey)){e.preventDefault();run()}});
</script>
</body>
</html>
